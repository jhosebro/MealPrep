# Gestión de vulnerabilidades técnicas (ISO 27001 A.8.8, SOC 2 CC7.1).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react-native", "react-native-*"]
